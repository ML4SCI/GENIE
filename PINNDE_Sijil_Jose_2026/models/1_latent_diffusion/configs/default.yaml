# Config as run. Mirrors the flags of the corresponding entrypoint;
# the matching result is committed under results/.
# Latent diffusion: the velocity field trained in the autoencoder's
# 96-dimensional latent, decoded through the frozen decoder.
# Reached its own reconstruction ceiling (0.991 against 0.989) -- the decoder
# is the limit, not the sampler. See docs/MODEL_EVOLUTION.md section 4.
model: latent_diffusion
code: {entrypoint: pinnde_calo/train_latent.py}
autoencoder: {checkpoint: unknown, caveat: "which AE this used is NOT recorded;
              see docs/MODEL_COMPARISON.md 2.3 -- the only AE checkpoints
              available are pre-v4"}
network: {shower_dim: 96, trunk: film, hidden: 512, hit_head: false,
          parameters: 1045600}
standardization: per_dimension      # unlike the voxel path's global scalar
training: {steps: 20000, batch: 256, lr: 2.0e-4}
notes: |
  Worst observable is the azimuthal energy centroid, EC phi chi2 ~ 0.445 for
  layers 26-29 -- far worse than any other model. A positional defect of the
  96-number bottleneck, which occupancy modelling will not fix.
